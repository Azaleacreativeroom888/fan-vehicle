<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギャラリー | のりものノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #008b8b;
  --teal-deep: #005f5f;
  --sand: #deb887;
  --sand-light: #f3e3c9;
  --ink: #0d3535;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  background: var(--sand);
  color: var(--ink);
  line-height: 1.9;
}
a { color: inherit; }
a:focus-visible { outline: 3px solid var(--teal-deep); outline-offset: 3px; }

/* header */
header { background: var(--teal); color: var(--sand-light); position: sticky; top: 0; z-index: 10; }
.bar {
  max-width: 960px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.logo { font-weight: 900; font-size: 1.3rem; text-decoration: none; letter-spacing: .08em; }
nav ul { list-style: none; display: flex; gap: 6px; flex-wrap: wrap; }
nav a { display: block; padding: 4px 14px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: .95rem; }
nav a:hover { background: rgba(243,227,201,.2); }
nav a[aria-current="page"] { background: var(--sand); color: var(--teal-deep); }

/* page title */
.title { background: var(--teal); color: var(--sand-light); padding: 40px 20px 32px; }
.title-inner { max-width: 960px; margin: 0 auto; }
.title h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 900; letter-spacing: .06em; }
.title p { margin-top: 6px; }

main { max-width: 960px; margin: 0 auto; padding: 40px 20px 24px; }
h2 {
  font-size: 1.5rem; font-weight: 900; color: var(--teal-deep);
  margin-bottom: 18px; padding-left: 14px; border-left: 10px solid var(--teal);
}
section + section { margin-top: 52px; }

/* work cards */
.works { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 22px; }
.work { background: var(--sand-light); border-radius: 12px; overflow: hidden; }
.work figure { margin: 0; }
.frame { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--teal); color: var(--sand-light); font-weight: 700; font-size: .9rem; }
.frame.tall { aspect-ratio: 3 / 4; background: var(--teal-deep); }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
figcaption { padding: 12px 16px 14px; }
figcaption strong { display: block; font-size: 1.05rem; }
figcaption span { font-size: .85rem; color: var(--teal-deep); font-weight: 700; }

footer { background: var(--teal); color: var(--sand-light); text-align: center; padding: 22px 20px; margin-top: 56px; font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">のりものノート</a>
    <nav aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="gallery.html" aria-current="page">ギャラリー</a></li>
        <li><a href="about.html">このサイトについて</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="title">
  <div class="title-inner">
    <h1>ギャラリー</h1>
    <p>乗り物をテーマに描いたイラストと漫画を並べています。</p>
  </div>
</section>

<main>
  <section aria-labelledby="illust">
    <h2 id="illust">イラスト</h2>
    <ul class="works">
      <!-- 画像に差し替えるときは、<div class="frame">…</div> の中身を
           <img src="images/ファイル名.png" alt="作品の説明"> に変えてください -->
      <li class="work"><figure>
        <div class="frame">イラスト 1</div>
        <figcaption><strong>作品タイトル</strong><span>2026年10月</span></figcaption>
      </figure></li>
      <li class="work"><figure>
        <div class="frame">イラスト 2</div>
        <figcaption><strong>作品タイトル</strong><span>2026年10月</span></figcaption>
      </figure></li>
      <li class="work"><figure>
        <div class="frame">イラスト 3</div>
        <figcaption><strong>作品タイトル</strong><span>2026年10月</span></figcaption>
      </figure></li>
    </ul>
  </section>

  <section aria-labelledby="manga">
    <h2 id="manga">漫画</h2>
    <ul class="works">
      <li class="work"><figure>
        <div class="frame tall">漫画 1</div>
        <figcaption><strong>作品タイトル</strong><span>第1話</span></figcaption>
      </figure></li>
      <li class="work"><figure>
        <div class="frame tall">漫画 2</div>
        <figcaption><strong>作品タイトル</strong><span>第2話</span></figcaption>
      </figure></li>
      <li class="work"><figure>
        <div class="frame tall">漫画 3</div>
        <figcaption><strong>作品タイトル</strong><span>読み切り</span></figcaption>
      </figure></li>
    </ul>
  </section>
</main>

<footer>&copy; のりものノート</footer>

</body>
</html>
